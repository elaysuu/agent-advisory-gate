name: refresh-advisory-data
on:
  schedule: [{ cron: '17 3 * * *' }]   # daily 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/refresh-data.js
      - run: cp data/mcp-advisories.json dist/mcp-advisories.json   # the bundled action reads dist/
      - run: AAG_OFFLINE=1 node --test test/
      - name: Commit if changed
        run: |
          if git diff --quiet -- data dist; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mcp-advisories.json dist/mcp-advisories.json
          git commit -m "data: refresh MCP advisories ($(date -u +%F))"
          git push
