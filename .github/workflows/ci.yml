name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node --test test/
      - name: Self-test bundled action on clean fixture
        uses: ./
        with: { config-paths: 'test/fixtures/clean/.cursor/mcp.json' }
